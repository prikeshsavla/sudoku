<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku Canvas" />
  <title>Canvas Sudoku</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- Header section -->
  <header>
    <div class="brand">
      <div class="brand-icon">9</div>
      <div>
        <h1 class="brand-title">Sudoku Canvas</h1>
        <p class="brand-sub">Offline PWA & Local Storage <span id="status">Checking connection status...</span>         <!-- GitHub Feature Request Button -->
        <a class="feedback-link" href="https://github.com/prikeshsavla/sudoku/issues/new?title=[Feature%20Request]:%20&amp;labels=enhancement" target="_blank" rel="noopener noreferrer" aria-label="Request a feature on GitHub">
          <span>💬 Feedback</span>
        </a></p>
      </div>
    </div>

    <div class="header-right">
      <button id="installAppBtn" class="btn-install hidden" title="Install App">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Install</span>
      </button>

      <div class="timer-block">
        <div class="timer-label">TIME</div>
        <div id="timerDisplay" class="timer-val">00:00</div>
      </div>

      <button id="pauseBtn" class="btn-icon" title="Pause Game">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </header>


  <!-- Main Game Section -->
  <main>
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="toolbar-left">
          <select id="difficultySelect">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>

          <button id="newGameBtn" class="btn-primary">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            New Game
          </button>

          <button id="resetBtn" class="btn-secondary" title="Reset puzzle to initial state">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 12v-3a8 8 0 0114.9-3M20 12v3a8 8 0 01-14.9 3" />
            </svg>
            Reset
          </button>
        </div>

        <div class="toolbar-hint">
          Tap cell to select
        </div>
      </div>

      <div class="toolbar-row seed-sharing-row">
        <button id="shareBtn" class="btn-secondary" title="Share current board link">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.684 10.742l4.636-2.318m0 0a3 3 0 102.632-3.72l-4.636 2.318m4.636 2.318a3 3 0 102.632 3.72l-4.636-2.318" />
          </svg>
          Share Board
        </button>

        <button id="importBtn" class="btn-secondary" title="Import 81-digit board string">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          Import Board
        </button>
      </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvasContainer" class="canvas-container">
      <canvas id="sudokuCanvas"></canvas>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="overlay hidden">
        <svg width="48" height="48" fill="#818cf8" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
            clip-rule="evenodd" />
        </svg>
        <p style="font-size: 18px; font-weight: 700; color: #fff;">Game Paused</p>
        <button id="resumeBtn" class="btn-primary" style="padding: 8px 20px;">Resume</button>
      </div>

      <!-- Victory Overlay -->
      <div id="victoryOverlay" class="overlay hidden">
        <div class="victory-badge">
          <svg width="32" height="32" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M10 2a1 1 0 011 1v1.323l1.954.682a2 2 0 011.233 2.502l-.68 2.04 1.706 1.138a2 2 0 01.787 2.68l-1 1.732a2 2 0 01-2.417.848L11 15.323V17a1 1 0 01-2 0v-1.677l-1.583.625a2 2 0 01-2.417-.848l-1-1.732a2 2 0 01.787-2.68l1.706-1.138-.68-2.04a2 2 0 011.233-2.502L8 4.323V3a1 1 0 011-1z"
              clip-rule="evenodd" />
          </svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 700; color: #fff;">Puzzle Solved!</h2>
        <p id="victoryTime" style="font-size: 14px; color: var(--text-muted);">Your time: 00:00</p>
        <button id="victoryNewGameBtn" class="btn-primary"
          style="background: var(--emerald); padding: 10px 24px; margin-top: 6px;">Play Again</button>
      </div>
    </div>

    <!-- Mobile Action Controls & Keypad -->
    <div class="controls-group">
      <div class="action-grid">
        <button id="undoBtn" class="action-btn" title="Undo Move (Ctrl+Z)">
          <svg width="14" height="14" fill="none" stroke="#818cf8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
          </svg>
          <span>Undo</span>
        </button>

        <button id="noteToggleBtn" class="action-btn" title="Toggle Note Mode (N)">
          <svg width="14" height="14" fill="none" stroke="#fbbf24" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
          <span>Note</span>
          <span id="noteStatusText" class="badge-note">OFF</span>
        </button>

        <button id="eraseBtn" class="action-btn" style="color: #f87171;" title="Erase Cell">
          <svg width="14" height="14" fill="none" stroke="#f87171" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Erase</span>
        </button>
      </div>

      <div class="numpad-grid">
        <button data-key="1" class="num-btn">1</button>
        <button data-key="2" class="num-btn">2</button>
        <button data-key="3" class="num-btn">3</button>
        <button data-key="4" class="num-btn">4</button>
        <button data-key="5" class="num-btn">5</button>
        <button data-key="6" class="num-btn">6</button>
        <button data-key="7" class="num-btn">7</button>
        <button data-key="8" class="num-btn">8</button>
        <button data-key="9" class="num-btn">9</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">Notification</div>
  <!-- Game logic and app script files (Modular ES6) -->
  <script type="module" src="./app.js"></script>
</body>

</html>
