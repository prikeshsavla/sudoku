<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku Canvas" />
  <title>Canvas Sudoku</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
    }
    canvas {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .num-btn {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="h-full flex flex-col items-center justify-between p-2 sm:p-4 select-none overflow-x-hidden">

  <header class="w-full max-w-xl flex items-center justify-between py-2 px-3 bg-slate-800/80 backdrop-blur rounded-xl border border-slate-700 shadow-md mb-2">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-indigo-600 rounded-lg text-white font-bold text-xl leading-none">
        <i class="fa-solid font-mono">9</i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white leading-tight">Sudoku Canvas</h1>
        <p class="text-xs text-slate-400">Offline PWA & Local Storage</p>
      </div>
    </div>

    <!-- Timer and Controls -->
    <div class="flex items-center gap-3">
      <button id="installAppBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow animate-pulse" title="Install App">
        <i class="fa-solid fa-download"></i>
        <span class="hidden sm:inline">Install</span>
      </button>

      <div class="text-right">
        <div class="text-xs text-slate-400 font-medium">TIME</div>
        <div id="timerDisplay" class="font-mono text-sm font-semibold text-indigo-400">00:00</div>
      </div>
      <button id="pauseBtn" class="p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition-colors">
        <i class="fa-solid fa-pause"></i>
      </button>
    </div>
  </header>

  <main class="w-full max-w-xl flex flex-col items-center gap-3 my-auto">
    
    <!-- Top toolbar for game management controls -->
    <div class="w-full flex items-center justify-between gap-2 px-1">
      <div class="flex items-center gap-2">
        <select id="difficultySelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs sm:text-sm rounded-lg px-3 py-1.5 font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>

        <button id="newGameBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-rotate-right"></i> New Game
        </button>
      </div>

      <div class="text-xs text-slate-400 font-medium hidden sm:block">
        Tap a cell to select
      </div>
    </div>

    <!-- Canvas container with fixed aspect ratio square -->
    <div id="canvasContainer" class="w-full relative aspect-square bg-slate-950 rounded-2xl border-2 border-slate-700 shadow-2xl p-1 flex items-center justify-center overflow-hidden">
      <canvas id="sudokuCanvas" class="w-full h-full rounded-xl cursor-pointer"></canvas>
      
      <!-- Pause overlay -->
      <div id="pauseOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur flex flex-col items-center justify-center gap-3 hidden z-20">
        <i class="fa-solid fa-circle-pause text-5xl text-indigo-400"></i>
        <p class="text-lg font-bold text-white">Game Paused</p>
        <button id="resumeBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded-xl transition shadow">
          Resume
        </button>
      </div>

      <!-- Victory overlay -->
      <div id="victoryOverlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur flex flex-col items-center justify-center gap-4 hidden z-20 transition-all">
        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-3xl mb-1 border border-emerald-500/40">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Puzzle Solved!</h2>
        <p id="victoryTime" class="text-sm text-slate-300">Your time: 00:00</p>
        <button id="victoryNewGameBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-lg mt-2">
          Play Again
        </button>
      </div>
    </div>

    <!-- Interactive Keypad & Mobile Thumb Controls -->
    <div class="w-full flex flex-col gap-2 mt-1">
      
      <!-- Mobile Thumb-Zone Actions Bar (Undo, Pencil Notes, Erase) -->
      <div class="grid grid-cols-3 gap-1.5">
        <button id="undoBtn" class="h-11 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-700/80 text-xs font-medium rounded-xl transition flex flex-col sm:flex-row items-center justify-center gap-1 shadow disabled:opacity-40 disabled:cursor-not-allowed" title="Undo Move (Ctrl+Z)">
          <i class="fa-solid fa-arrow-rotate-left text-indigo-400"></i>
          <span class="text-[10px] sm:text-xs">Undo</span>
        </button>

        <button id="noteToggleBtn" class="h-11 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-slate-200 border border-slate-700/80 text-xs font-medium rounded-xl transition flex flex-col sm:flex-row items-center justify-center gap-1 shadow" title="Toggle Note Mode (N)">
          <i class="fa-solid fa-pencil text-amber-400"></i>
          <div class="flex items-center gap-1">
            <span class="text-[10px] sm:text-xs">Note</span>
            <span id="noteStatusText" class="bg-slate-700 text-slate-400 px-1 py-0.2 rounded text-[9px] font-bold">OFF</span>
          </div>
        </button>

        <button id="eraseBtn" class="h-11 bg-slate-800 hover:bg-slate-700 active:bg-rose-900/40 text-rose-400 border border-slate-700/80 text-xs font-medium rounded-xl transition flex flex-col sm:flex-row items-center justify-center gap-1 shadow" title="Erase Cell">
          <i class="fa-solid fa-eraser"></i>
          <span class="text-[10px] sm:text-xs">Erase</span>
        </button>
      </div>

      <!-- 1-9 Numpad Buttons -->
      <div class="grid grid-cols-9 gap-1.5 mt-0.5">
        <button data-key="1" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">1</button>
        <button data-key="2" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">2</button>
        <button data-key="3" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">3</button>
        <button data-key="4" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">4</button>
        <button data-key="5" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">5</button>
        <button data-key="6" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">6</button>
        <button data-key="7" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">7</button>
        <button data-key="8" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">8</button>
        <button data-key="9" class="num-btn h-12 sm:h-14 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 text-white font-bold text-lg sm:text-xl rounded-xl border border-slate-700/80 transition-all shadow active:scale-95 flex items-center justify-center">9</button>
      </div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-2 rounded-xl text-sm shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-30">
    Notification
  </div>

  <script>
    // Generate and register web application manifest dynamically
    const manifestBlob = new Blob([JSON.stringify({
      name: "Sudoku Canvas Game",
      short_name: "Sudoku",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [
        {
          src: "https://placehold.co/192x192/0f172a/6366f1?text=Sudoku",
          sizes: "192x192",
          type: "image/png"
        },
        {
          src: "https://placehold.co/512x512/0f172a/6366f1?text=Sudoku",
          sizes: "512x512",
          type: "image/png"
        }
      ]
    })], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);

    // Register offline Service Worker using Blob
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'sudoku-v1';
        self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match('./')))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW Error:', err));
    }

    class SudokuCanvasGame {
      constructor() {
        this.canvas = document.getElementById('sudokuCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.gridSize = 9;
        
        // Game State
        this.initialBoard = Array(9).fill(null).map(() => Array(9).fill(0));
        this.currentBoard = Array(9).fill(null).map(() => Array(9).fill(0));
        this.solution = Array(9).fill(null).map(() => Array(9).fill(0));
        this.notes = Array(9).fill(null).map(() => Array(9).fill(null).map(() => new Set()));
        this.conflicts = Array(9).fill(null).map(() => Array(9).fill(false));
        
        this.selectedCell = null; // { row, col }
        this.isNoteMode = false;
        this.undoStack = [];
        this.isPaused = false;
        this.isVictory = false;

        // Timer
        this.secondsElapsed = 0;
        this.timerInterval = null;

        // Storage Key
        this.STORAGE_KEY = 'sudoku_canvas_state_v1';

        this.init();
      }

      init() {
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        this.setupEventListeners();

        // Try restoring state from localStorage, else start new game
        if (!this.loadGameState()) {
          this.startNewGame('medium');
        } else {
          this.startTimer();
          this.updateUndoButton();
          this.render();
          this.showToast('Restored previous game state');
        }
      }

      saveGameState() {
        try {
          const stateData = {
            initialBoard: this.initialBoard,
            currentBoard: this.currentBoard,
            solution: this.solution,
            notes: this.notes.map(row => row.map(cellSet => Array.from(cellSet))),
            undoStack: this.undoStack.map(action => ({
              ...action,
              prevNotes: Array.from(action.prevNotes || []),
              newNotes: Array.from(action.newNotes || [])
            })),
            secondsElapsed: this.secondsElapsed,
            difficulty: document.getElementById('difficultySelect').value,
            isVictory: this.isVictory
          };
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(stateData));
        } catch (e) {
          console.warn('LocalStorage save failed:', e);
        }
      }

      loadGameState() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          
          if (!data || !data.currentBoard || !data.initialBoard) return false;

          this.initialBoard = data.initialBoard;
          this.currentBoard = data.currentBoard;
          this.solution = data.solution;
          this.notes = data.notes.map(row => row.map(arr => new Set(arr)));
          this.secondsElapsed = data.secondsElapsed || 0;
          this.isVictory = data.isVictory || false;
          
          if (data.difficulty) {
            document.getElementById('difficultySelect').value = data.difficulty;
          }

          this.undoStack = (data.undoStack || []).map(action => ({
            ...action,
            prevNotes: new Set(action.prevNotes || []),
            newNotes: new Set(action.newNotes || [])
          }));

          this.updateConflicts();
          return true;
        } catch (e) {
          console.error('Failed to load state from LocalStorage:', e);
          return false;
        }
      }

      clearGameState() {
        try {
          localStorage.removeItem(this.STORAGE_KEY);
        } catch (e) {
          console.warn('LocalStorage clear failed:', e);
        }
      }

      resizeCanvas() {
        const container = document.getElementById('canvasContainer');
        const rect = container.getBoundingClientRect();
        const size = Math.min(rect.width, rect.height) - 8;
        const dpr = window.devicePixelRatio || 1;

        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.canvas.style.width = `${size}px`;
        this.canvas.style.height = `${size}px`;

        this.ctx.scale(dpr, dpr);
        this.cellSize = size / 9;
        this.render();
      }

      startNewGame(difficulty = 'medium') {
        this.isVictory = false;
        document.getElementById('victoryOverlay').classList.add('hidden');
        document.getElementById('pauseOverlay').classList.add('hidden');
        
        // Generate solved board
        this.solution = Array(9).fill(null).map(() => Array(9).fill(0));
        this.fillBoard(this.solution);

        // Copy solution to initial and remove numbers based on difficulty
        this.initialBoard = this.solution.map(row => [...row]);
        
        const removeCount = {
          easy: 35,
          medium: 45,
          hard: 52,
          expert: 58
        }[difficulty] || 45;

        let removed = 0;
        while (removed < removeCount) {
          const r = Math.floor(Math.random() * 9);
          const c = Math.floor(Math.random() * 9);
          if (this.initialBoard[r][c] !== 0) {
            this.initialBoard[r][c] = 0;
            removed++;
          }
        }

        this.currentBoard = this.initialBoard.map(row => [...row]);
        this.notes = Array(9).fill(null).map(() => Array(9).fill(null).map(() => new Set()));
        this.undoStack = [];
        this.selectedCell = null;
        this.secondsElapsed = 0;

        this.updateConflicts();
        this.updateUndoButton();
        this.startTimer();
        this.saveGameState();
        this.render();
        this.showToast(`New ${difficulty.toUpperCase()} game started`);
      }

      fillBoard(board) {
        const findEmpty = () => {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (board[r][c] === 0) return [r, c];
            }
          }
          return null;
        };

        const empty = findEmpty();
        if (!empty) return true;
        const [r, c] = empty;

        const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);

        for (const num of nums) {
          if (this.isValidPlacement(board, r, c, num)) {
            board[r][c] = num;
            if (this.fillBoard(board)) return true;
            board[r][c] = 0;
          }
        }
        return false;
      }

      isValidPlacement(board, row, col, num) {
        for (let i = 0; i < 9; i++) {
          if (board[row][i] === num && i !== col) return false;
          if (board[i][col] === num && i !== row) return false;
        }
        const boxR = Math.floor(row / 3) * 3;
        const boxC = Math.floor(col / 3) * 3;
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const nr = boxR + r;
            const nc = boxC + c;
            if (board[nr][nc] === num && (nr !== row || nc !== col)) return false;
          }
        }
        return true;
      }

      updateConflicts() {
        this.conflicts = Array(9).fill(null).map(() => Array(9).fill(false));
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const val = this.currentBoard[r][c];
            if (val !== 0) {
              if (!this.isValidPlacement(this.currentBoard, r, c, val)) {
                this.conflicts[r][c] = true;
              }
            }
          }
        }
      }

      handleCellInput(num) {
        if (!this.selectedCell || this.isVictory || this.isPaused) return;
        const { row, col } = this.selectedCell;

        // Cannot modify initial given numbers
        if (this.initialBoard[row][col] !== 0) {
          this.showToast("Cannot modify fixed numbers");
          return;
        }

        const prevVal = this.currentBoard[row][col];
        const prevNotes = new Set(this.notes[row][col]);

        if (this.isNoteMode) {
          if (num === 0) {
            // Erase notes when in Note Mode
            this.notes[row][col].clear();
          } else {
            // Toggle note candidate
            if (this.notes[row][col].has(num)) {
              this.notes[row][col].delete(num);
            } else {
              this.notes[row][col].add(num);
            }
          }
          this.currentBoard[row][col] = 0; // Note entry clears main number so notes are visible
        } else {
          // Normal mode: enter number or erase
          if (num === 0) {
            // Erase main number only; preserve underlying pencil notes intact
            this.currentBoard[row][col] = 0;
          } else if (prevVal === num) {
            // Toggling off the main number reveals underlying pencil notes
            this.currentBoard[row][col] = 0;
          } else {
            this.currentBoard[row][col] = num;
            // Notes are preserved in state and hidden while main entry exists
          }
        }

        // Record for Undo history
        const newNotes = new Set(this.notes[row][col]);
        const newVal = this.currentBoard[row][col];

        if (prevVal !== newVal || [...prevNotes].join(',') !== [...newNotes].join(',')) {
          this.undoStack.push({
            row, col,
            prevVal, newVal,
            prevNotes, newNotes
          });
          this.updateUndoButton();
        }

        this.updateConflicts();
        this.checkWinCondition();
        this.saveGameState();
        this.render();
      }

      undo() {
        if (this.undoStack.length === 0 || this.isVictory || this.isPaused) return;

        const action = this.undoStack.pop();
        const { row, col, prevVal, prevNotes } = action;

        this.currentBoard[row][col] = prevVal;
        this.notes[row][col] = new Set(prevNotes);

        this.selectedCell = { row, col };
        this.updateConflicts();
        this.updateUndoButton();
        this.saveGameState();
        this.render();
        this.showToast("Move undone");
      }

      updateUndoButton() {
        const undoBtn = document.getElementById('undoBtn');
        undoBtn.disabled = this.undoStack.length === 0;
      }

      render() {
        const width = this.canvas.width / (window.devicePixelRatio || 1);
        const height = this.canvas.height / (window.devicePixelRatio || 1);
        const cs = this.cellSize;

        this.ctx.clearRect(0, 0, width, height);

        // 1. Draw Cell Highlights
        const selectedVal = this.selectedCell ? this.currentBoard[this.selectedCell.row][this.selectedCell.col] : null;

        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const x = c * cs;
            const y = r * cs;

            let bgColor = '#0f172a'; // Base canvas background

            if (this.selectedCell) {
              const { row: selR, col: selC } = this.selectedCell;

              // Row, Col, Subgrid highlight
              const sameBox = Math.floor(r/3) === Math.floor(selR/3) && Math.floor(c/3) === Math.floor(selC/3);
              if (r === selR || c === selC || sameBox) {
                bgColor = '#1e293b'; // Slate 800
              }

              // Same number highlight
              const val = this.currentBoard[r][c];
              if (selectedVal !== 0 && val === selectedVal) {
                bgColor = '#312e81'; // Indigo 900
              }

              // Selected Cell active focus
              if (r === selR && c === selC) {
                bgColor = '#3730a3'; // Indigo 800
              }
            }

            // Conflict Error Highlight (Red background)
            if (this.conflicts[r][c]) {
              bgColor = '#7f1d1d'; // Rose 900
            }

            this.ctx.fillStyle = bgColor;
            this.ctx.fillRect(x, y, cs, cs);
          }
        }

        // 2. Draw Grid Lines
        for (let i = 0; i <= 9; i++) {
          this.ctx.beginPath();
          this.ctx.lineWidth = (i % 3 === 0) ? 3 : 1;
          this.ctx.strokeStyle = (i % 3 === 0) ? '#475569' : '#334155';

          // Vertical
          this.ctx.moveTo(i * cs, 0);
          this.ctx.lineTo(i * cs, height);

          // Horizontal
          this.ctx.moveTo(0, i * cs);
          this.ctx.lineTo(width, i * cs);
          this.ctx.stroke();
        }

        // 3. Draw Cell Content (Numbers & Pencil Notes)
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const x = c * cs;
            const y = r * cs;
            const val = this.currentBoard[r][c];
            const isInitial = this.initialBoard[r][c] !== 0;

            if (val !== 0) {
              // Draw Main Number
              this.ctx.font = `${isInitial ? '700' : '600'} ${cs * 0.5}px Inter, sans-serif`;
              this.ctx.textAlign = 'center';
              this.ctx.textBaseline = 'middle';

              if (this.conflicts[r][c]) {
                this.ctx.fillStyle = '#fca5a5'; // Light Red for error text
              } else if (isInitial) {
                this.ctx.fillStyle = '#f8fafc'; // Crisp White
              } else {
                this.ctx.fillStyle = '#818cf8'; // Indigo 400
              }

              this.ctx.fillText(val, x + cs / 2, y + cs / 2 + 2);
            } else {
              // Draw 3x3 Pencil Notes
              const cellNotes = this.notes[r][c];
              if (cellNotes && cellNotes.size > 0) {
                this.ctx.font = `500 ${cs * 0.22}px Inter, sans-serif`;
                this.ctx.fillStyle = '#94a3b8'; // Slate 400
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';

                const subCs = cs / 3;
                for (let note = 1; note <= 9; note++) {
                  if (cellNotes.has(note)) {
                    const nr = Math.floor((note - 1) / 3);
                    const nc = (note - 1) % 3;
                    const nx = x + nc * subCs + subCs / 2;
                    const ny = y + nr * subCs + subCs / 2;
                    this.ctx.fillText(note, nx, ny);
                  }
                }
              }
            }
          }
        }
      }

      checkWinCondition() {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (this.currentBoard[r][c] === 0 || this.conflicts[r][c]) {
              return false;
            }
          }
        }

        // Solved successfully!
        this.isVictory = true;
        this.stopTimer();
        this.clearGameState();

        document.getElementById('victoryTime').textContent = `Your time: ${this.formatTime(this.secondsElapsed)}`;
        document.getElementById('victoryOverlay').classList.remove('hidden');
        return true;
      }

      setupEventListeners() {
        // Canvas Click/Touch selection
        const handleCanvasPointer = (e) => {
          e.preventDefault();
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          const x = clientX - rect.left;
          const y = clientY - rect.top;

          const col = Math.floor(x / (rect.width / 9));
          const row = Math.floor(y / (rect.height / 9));

          if (row >= 0 && row < 9 && col >= 0 && col < 9) {
            this.selectedCell = { row, col };
            this.render();
          }
        };

        this.canvas.addEventListener('mousedown', handleCanvasPointer);
        this.canvas.addEventListener('touchstart', handleCanvasPointer, { passive: false });

        // Numpad Buttons
        document.querySelectorAll('.num-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = parseInt(btn.getAttribute('data-key'));
            this.handleCellInput(key);
          });
        });

        // Action Buttons
        document.getElementById('eraseBtn').addEventListener('click', () => this.handleCellInput(0));
        document.getElementById('undoBtn').addEventListener('click', () => this.undo());
        
        // Note Toggle Button with dynamic active style feedback
        const noteBtn = document.getElementById('noteToggleBtn');
        const noteStatus = document.getElementById('noteStatusText');
        noteBtn.addEventListener('click', () => {
          this.isNoteMode = !this.isNoteMode;
          noteStatus.textContent = this.isNoteMode ? 'ON' : 'OFF';
          
          if (this.isNoteMode) {
            noteBtn.classList.remove('bg-slate-800', 'border-slate-700/80', 'text-slate-200');
            noteBtn.classList.add('bg-indigo-600', 'border-indigo-400', 'text-white');
            noteStatus.className = 'bg-white/20 text-white px-1 py-0.2 rounded text-[9px] font-bold';
          } else {
            noteBtn.classList.remove('bg-indigo-600', 'border-indigo-400', 'text-white');
            noteBtn.classList.add('bg-slate-800', 'border-slate-700/80', 'text-slate-200');
            noteStatus.className = 'bg-slate-700 text-slate-400 px-1 py-0.2 rounded text-[9px] font-bold';
          }

          this.showToast(this.isNoteMode ? 'Pencil Note Mode ON' : 'Normal Entry Mode ON');
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
          if (this.isPaused || this.isVictory) return;

          if (e.key >= '1' && e.key <= '9') {
            this.handleCellInput(parseInt(e.key));
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            this.handleCellInput(0);
          } else if (e.key.toLowerCase() === 'n') {
            noteBtn.click();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            this.undo();
          } else if (this.selectedCell) {
            let { row, col } = this.selectedCell;
            if (e.key === 'ArrowUp') row = Math.max(0, row - 1);
            if (e.key === 'ArrowDown') row = Math.min(8, row + 1);
            if (e.key === 'ArrowLeft') col = Math.max(0, col - 1);
            if (e.key === 'ArrowRight') col = Math.min(8, col + 1);
            this.selectedCell = { row, col };
            this.render();
          }
        });

        // Game Controls
        document.getElementById('newGameBtn').addEventListener('click', () => {
          const diff = document.getElementById('difficultySelect').value;
          this.startNewGame(diff);
        });

        document.getElementById('victoryNewGameBtn').addEventListener('click', () => {
          const diff = document.getElementById('difficultySelect').value;
          this.startNewGame(diff);
        });

        // Pause / Resume
        const pauseOverlay = document.getElementById('pauseOverlay');
        document.getElementById('pauseBtn').addEventListener('click', () => {
          this.isPaused = true;
          this.stopTimer();
          pauseOverlay.classList.remove('hidden');
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
          this.isPaused = false;
          this.startTimer();
          pauseOverlay.classList.add('hidden');
        });
      }

      startTimer() {
        this.stopTimer();
        this.timerInterval = setInterval(() => {
          if (!this.isPaused && !this.isVictory) {
            this.secondsElapsed++;
            document.getElementById('timerDisplay').textContent = this.formatTime(this.secondsElapsed);
            
            // Periodically sync time to localStorage
            if (this.secondsElapsed % 10 === 0) {
              this.saveGameState();
            }
          }
        }, 1000);
      }

      stopTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }

      formatTime(secs) {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 2200);
      }
    }

    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installAppBtn.classList.remove('hidden');
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installAppBtn.classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    // Initialize Game Instance on Window Load
    window.addEventListener('load', () => {
      window.sudokuGame = new SudokuCanvasGame();
    });
  </script>
</body>
